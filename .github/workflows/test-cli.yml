name: Test CLI and release packages

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: node ./bin/tech-branding-logo.js --help
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-node-${{ matrix.node }}
          path: dist/
