name: Test CLI

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'schemas/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'SKILL.md'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'schemas/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'SKILL.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node ./bin/tech-branding-logo.js --help
